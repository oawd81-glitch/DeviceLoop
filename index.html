<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeviceLoop | تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DeviceLoop</h1>
        <p>منصة لبيع وشراء الأجهزة الإلكترونية المستعملة</p>

        <nav>
            <a href="home.html">الرئيسية</a>
            <a href="devices.html">تصفح الأجهزة</a>
            <a href="sell.html">بيع جهاز</a>
            <a href="index.html">تسجيل الدخول</a>
            <a href="contact.html">تواصل معنا</a>
        </nav>
    </header>

    <main>

        <section class="auth-section">
            <h2>تسجيل الدخول</h2>

            <p>أدخل بيانات حسابك للدخول إلى DeviceLoop.</p>

            <form>

                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" required>

                <br><br>

                <input type="checkbox" id="remember" name="remember">
                <label for="remember">تذكرني</label>

                <br><br>

                <button type="submit">تسجيل الدخول</button>

            </form>

            <p>
                ليس لديك حساب؟
                <a href="register.html">إنشاء حساب</a>
            </p>

        </section>

    </main>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 DeviceLoop</p>
    </footer>

</body>

</html>
