<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeviceLoop | بيع جهاز</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DeviceLoop</h1>
        <p>منصة لبيع وشراء الأجهزة الإلكترونية المستعملة</p>

<button id="menu-toggle" class="menu-toggle" type="button">
    ☰
</button>

        <nav>
            <a href="home.html">الرئيسية</a>
            <a href="devices.html">تصفح الأجهزة</a>
            <a href="sell.html">بيع جهاز</a>
            <a href="index.html">تسجيل الدخول</a>
            <a href="contact.html">تواصل معنا</a>
        </nav>
    </header>

    <main>

        <section class="form-section">
            <h2>بيع جهاز</h2>
            <p>أدخل بيانات الجهاز الذي تريد عرضه للبيع على DeviceLoop.</p>

            <form id="sell-form">

                <h3>بيانات البائع</h3>

                <label for="seller-name">اسم البائع:</label>
                <input type="text" id="seller-name" name="seller-name">

                <br><br>

                <label for="seller-email">البريد الإلكتروني:</label>
                <input type="email" id="seller-email" name="seller-email">

                <br><br>

                <h3>بيانات الجهاز</h3>

                <label for="device-name">اسم الجهاز:</label>
                <input type="text" id="device-name" name="device-name">

                <br><br>

                <label for="brand">العلامة التجارية:</label>
                <input type="text" id="brand" name="brand">

                <br><br>

                <label for="category">الفئة:</label>
                <select id="category" name="category">
                <option value="">اختر الفئة</option>
                    <option>هاتف ذكي</option>
                    <option>لابتوب</option>
                    <option>جهاز لوحي</option>
                    <option>جهاز ألعاب</option>
                    <option>ساعة ذكية</option>
                    <option>إكسسوارات</option>
                </select>

                <br><br>

                <label for="condition">الحالة:</label>
                <select id="condition" name="condition">
                <option value="">اختر حالة الجهاز</option>
                    <option>ممتازة</option>
                    <option>جيدة جدًا</option>
                    <option>جيدة</option>
                    <option>مقبولة</option>
                </select>

                <br><br>

                <label for="price">السعر:</label>
                <input type="number" id="price" name="price">

                <br><br>

                <label for="description">وصف الجهاز:</label>
                <br>
                <textarea id="description" name="description" rows="6" cols="40"></textarea>

                <br><br>

                <button type="submit">عرض الجهاز للبيع</button>

            </form>
        </section>

    </main>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 DeviceLoop</p>
    </footer>

<script src="script.js"></script>
</body>

</html>
